<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pipeline - Conversation</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <span class="nav-brand-icon">🤖</span>
                <span>AI Pipeline</span>
            </div>
            <ul class="nav-links">
                <li><a href="/" class="nav-link active">💬 Chat</a></li>
                <li><a href="/logs" class="nav-link">📋 Logs</a></li>
                <li><a href="/outputs" class="nav-link">📁 Outputs</a></li>
                <li><a href="/guardrails" class="nav-link">🛡️ Guardrails</a></li>
                <li><a href="/status" class="nav-link">📊 Status</a></li>
            </ul>
        </div>
    </nav>

    <div class="page-wrapper" style="padding-top: 2rem;">
        <div class="container">
            <!-- Header -->
            <div class="glass-card"
                style="margin-bottom: 1.5rem; padding: 1.5rem; background: linear-gradient(to right, rgba(99, 102, 241, 0.1), transparent);">
                <div class="flex justify-between items-center">
                    <div>
                        <h1>AI Command Center</h1>
                        <p class="text-muted" style="font-size: 1.1rem;">Interactive Pipeline & EDA Orchestration</p>
                    </div>
                    <div class="flex gap-2 items-center">
                        <span class="badge badge-info" id="sessionBadge">Starting...</span>
                        <button class="btn btn-success" onclick="startNewChat()" title="Start a new conversation">
                            ➕ New Chat
                        </button>
                        <button class="btn btn-secondary" id="modeToggle" onclick="toggleChatMode()">
                            📜 History
                        </button>
                    </div>
                </div>
            </div>

            <!-- EDA Quick Actions -->
            <div class="glass-card mb-3" id="edaActionsCard">
                <div class="glass-card-header">
                    <h3 class="glass-card-title">🔍 Quick EDA Actions</h3>
                    <span class="badge badge-success">NEW</span>
                </div>
                <div class="glass-card-body">
                    <div class="flex gap-2" style="flex-wrap: wrap;">
                        <button class="btn btn-secondary" onclick="sendQuickQuery('What datasets are available?')">
                            📂 List Datasets
                        </button>
                        <button class="btn btn-secondary"
                            onclick="sendQuickQuery('What are the columns in the dataset?')">
                            📊 Show Columns
                        </button>
                        <button class="btn btn-secondary" onclick="sendQuickQuery('Show me statistics for the data')">
                            📈 Compute Stats
                        </button>
                        <button class="btn btn-secondary" onclick="sendQuickQuery('Show correlations between columns')">
                            🔗 Find Correlations
                        </button>
                        <button class="btn btn-secondary"
                            onclick="sendQuickQuery('Create a histogram of the target column')">
                            📉 Create Plot
                        </button>
                        <button class="btn btn-primary" onclick="refreshDatasets()" id="refreshDataBtn">
                            🔄 Refresh Data
                        </button>
                    </div>
                </div>
            </div>

            <!-- Session Selector (History Mode Only) -->
            <div class="glass-card mb-3" id="sessionSelectorCard">
                <div class="glass-card-header">
                    <h3 class="glass-card-title">Select Conversation</h3>
                </div>
                <div class="glass-card-body">
                    <select id="sessionSelector" class="form-select" onchange="loadSelectedConversation()">
                        <option value="">Loading sessions...</option>
                    </select>
                </div>
            </div>

            <!-- Chat Container -->
            <div class="glass-card">
                <div class="chat-container">
                    <div class="chat-messages" id="chatMessages">
                        <div class="flex justify-center items-center" style="height: 100%;">
                            <div class="spinner"></div>
                        </div>
                    </div>

                    <!-- Chat Input (Live Mode Only) -->
                    <div class="chat-input-container" id="chatInputContainer" style="display: none;">
                        <div class="flex gap-2 items-center"
                            style="padding: var(--spacing-md); border-top: 1px solid var(--glass-border);">
                            <input type="text" id="messageInput" class="form-input"
                                placeholder="Ask about your data, run EDA queries, or manage pipeline tasks..."
                                onkeypress="handleKeyPress(event)" />
                            <button class="btn btn-primary" onclick="sendMessage()" id="sendButton">
                                <span>Send</span>
                                <span>✉️</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/chat.js"></script>
</body>

</html>
